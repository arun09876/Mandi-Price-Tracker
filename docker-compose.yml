services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: mandi, POSTGRES_USER: mandi, POSTGRES_PASSWORD: mandi }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment: &env
      DATABASE_URL: postgres://mandi:mandi@db:5432/mandi
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment: *env
    depends_on: [db, redis]
  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment: *env
    depends_on: [db, redis]
volumes:
  pgdata:
